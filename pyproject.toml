[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viirs_slstr_hotspots"
version = "0.1.0"
description = "Обнаружение горячих точек в лесах по данным VIIRS и Sentinel-3 SLSTR"
requires-python = ">=3.11"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "numba>=0.59",
    "xarray>=2024.2",
    "dask>=2024.2",
    "zarr>=2.17",
    "pyproj>=3.6",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyarrow>=15.0",
    "satpy>=0.50",
    "pyspectral>=0.13",
    "earthaccess>=0.8",
    "eumdac>=4.0",
    "pystac-client>=0.7",
    "scikit-image>=0.22",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "netCDF4>=1.6",
    "numcodecs>=0.12",
    "structlog>=24.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["viirs_slstr_hotspots*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

dependencies = [
    "rasterio>=1.3",
    "geopandas>=0.14",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true